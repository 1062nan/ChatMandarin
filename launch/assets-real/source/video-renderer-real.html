<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>ChatMandarin real-site walkthrough renderer</title>
  <style>
    html, body { margin: 0; min-height: 100%; background: #151d27; color: white; font-family: system-ui, sans-serif; }
    main { min-height: 100vh; display: grid; place-items: center; align-content: center; gap: 16px; }
    canvas { width: 1280px; height: 720px; border-radius: 14px; background: #f7f4ec; box-shadow: 0 26px 80px rgba(0,0,0,.45); }
    button { padding: 13px 20px; border: 0; border-radius: 10px; background: #c4412e; color: white; font-weight: 800; }
    p { margin: 0; color: #cdd4db; }
  </style>
</head>
<body>
  <main>
    <canvas id="video" width="1280" height="720"></canvas>
    <button id="render">Render real-site MP4</button>
    <p id="status">Ready</p>
  </main>
  <script>
    const canvas = document.querySelector('#video');
    const ctx = canvas.getContext('2d');
    const button = document.querySelector('#render');
    const status = document.querySelector('#status');
    const slides = [
      { src: '../01-dashboard-real.png', title: 'Start from your learning path', sub: 'A real production test account', start: 0, end: 4 },
      { src: '../02-hsk-path-real.png', title: 'Switch to HSK exam mode', sub: 'Level, grammar points and exercise types', start: 4, end: 7 },
      { src: '../03-conversation-start-real.png', title: 'Enter a real voice scenario', sub: 'Restaurant Ordering · HSK 1', start: 7, end: 11 },
      { src: '../04-feedback-real.png', title: 'Receive real production feedback', sub: 'ASR transcript, four scores and the next AI reply', start: 11, end: 16 },
      { src: '../05-hskk-real.png', title: 'Choose HSKK-style practice', sub: 'Beginner, intermediate or advanced', start: 16, end: 19 },
      { src: '../06-pricing-real.png', title: 'Start free', sub: '5 minutes per day · No credit card required', start: 19, end: 23 }
    ];

    const loaded = Promise.all(slides.map(slide => new Promise((resolve, reject) => {
      const image = new Image();
      image.onload = () => resolve({ ...slide, image });
      image.onerror = reject;
      image.src = slide.src;
    })));

    function drawCover(image, zoom, alpha = 1) {
      const targetRatio = canvas.width / canvas.height;
      const sourceRatio = image.width / image.height;
      let sw = image.width;
      let sh = image.height;
      if (sourceRatio > targetRatio) sw = sh * targetRatio;
      else sh = sw / targetRatio;
      sw /= zoom;
      sh /= zoom;
      ctx.globalAlpha = alpha;
      ctx.drawImage(image, (image.width-sw)/2, (image.height-sh)/2, sw, sh, 0, 0, canvas.width, canvas.height);
      ctx.globalAlpha = 1;
    }

    function drawCaption(title, sub, alpha) {
      ctx.globalAlpha = alpha;
      const gradient = ctx.createLinearGradient(0, 500, 0, 720);
      gradient.addColorStop(0, 'rgba(15,24,35,0)');
      gradient.addColorStop(1, 'rgba(15,24,35,.94)');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 490, 1280, 230);
      ctx.fillStyle = '#fff';
      ctx.font = '700 37px system-ui, sans-serif';
      ctx.fillText(title, 50, 630);
      ctx.fillStyle = '#e5eaf0';
      ctx.font = '400 21px system-ui, sans-serif';
      ctx.fillText(sub, 51, 671);
      ctx.globalAlpha = 1;
    }

    function paint(slideData, seconds) {
      let index = slideData.findIndex(item => seconds >= item.start && seconds < item.end);
      if (index < 0) index = slideData.length - 1;
      const current = slideData[index];
      const progress = Math.max(0, Math.min(1, (seconds-current.start)/(current.end-current.start)));
      ctx.clearRect(0,0,1280,720);
      drawCover(current.image, 1.01 + progress*.025);
      if (index < slideData.length - 1 && current.end-seconds < .45) {
        const mix = 1 - (current.end-seconds)/.45;
        drawCover(slideData[index+1].image, 1.01, Math.max(0,Math.min(1,mix)));
      }
      const fadeIn = Math.min(1, Math.max(0, (seconds-current.start)/.35));
      const fadeOut = Math.min(1, Math.max(0, (current.end-seconds)/.35));
      drawCaption(current.title,current.sub,Math.min(fadeIn,fadeOut));
    }

    loaded.then(data => paint(data,0));

    button.addEventListener('click', async () => {
      button.disabled = true;
      const data = await loaded;
      const stream = canvas.captureStream(6);
      const selectedType = ['video/mp4;codecs=avc1.42E01E','video/mp4'].find(type => MediaRecorder.isTypeSupported(type));
      const recorder = new MediaRecorder(stream,{mimeType:selectedType,videoBitsPerSecond:3200000});
      const chunks=[];
      recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
      const stopped=new Promise(resolve=>recorder.onstop=resolve);
      const start=performance.now();
      const wallSeconds=23.3;
      recorder.start(500);
      await new Promise(resolve=>{
        function frame(now){
          const wall=(now-start)/1000;
          const seconds=Math.min(23,wall*23/wallSeconds);
          paint(data,seconds);
          status.textContent=`Rendering ${seconds.toFixed(1)} / 23.0 seconds`;
          if(wall<wallSeconds)requestAnimationFrame(frame);else resolve();
        }
        requestAnimationFrame(frame);
      });
      recorder.stop();
      await stopped;
      const blob=new Blob(chunks,{type:selectedType});
      const response=await fetch('/save-real-video',{method:'POST',headers:{'Content-Type':selectedType},body:blob});
      if(!response.ok)throw new Error('Save failed');
      status.textContent=`Saved ${Math.round(blob.size/1024)} KB · real production screenshots`;
      button.textContent='Rendered successfully';
    });
  </script>
</body>
</html>
