name = "chatmandarin"
compatibility_date = "2024-09-01"
pages_build_output_dir = "."

# KV 绑定（需要在 Cloudflare dashboard 先创建 WAITLIST namespace）
[[kv_namespaces]]
binding = "WAITLIST"
id = "80aa104c85614d269b6236b1f693d5a1"

# 管理后台密钥必须在 Cloudflare Pages 的加密环境变量中设置：
# Settings → Environment variables → ADMIN_TOKEN
# 不要把密钥写入 wrangler.toml 或源码。
